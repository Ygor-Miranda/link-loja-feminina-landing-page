<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumiere Fashion</title>
  <meta name="description" content="Lumière Fashion - Moda feminina elegante e sofisticada. Fale conosco pelo WhatsApp ou siga no Instagram.">

  <!-- Fontes Playfair Display (títulos/logo) + Montserrat (textos/botões) hospedadas localmente em assets/fonts,
       para não depender do carregamento do Google Fonts (evita ficar sem serifa caso a rede bloqueie o CDN) -->
  <link rel="stylesheet" href="style.css">

  <div class="page-bg" aria-hidden="true"></div>
